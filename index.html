    <!-- Open Graph / Facebook -->

    <meta property="og:locale" content="pt_PT" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://bibliaon.org/" />
    <meta name="twitter:title" content="BIBLIA ON — Estudo Bíblico com Inteligência Artificial" />
    <meta name="twitter:description" content="Pesquisa exegética, concordância bíblica, léxico hebraico/grego e diálogo com figuras bíblicas fiéis ao cânon sagrado." />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "BIBLIA ON",
        "url": "https://bibliaon.org/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Plataforma de estudo bíblico rigoroso, exegese, léxico hebraico-grego e inteligência artificial baseada na Tradução do Novo Mundo.",
        "inLanguage": ["pt", "en", "es", "fr"]
      }
    </script>

    <!-- Script de sincronização imediata de tema (Claro / Escuro) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('biblia_on_theme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0B192C] dark:text-slate-100 min-h-screen font-sans antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
